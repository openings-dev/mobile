name: Android internal release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Google Play version code
        required: true
        type: number
      version_name:
        description: Public semantic version without the v prefix
        required: true
        type: string
      validate_only:
        default: false
        description: Validate credentials without building or publishing
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release inputs and Android credentials
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version_name must be a semantic version without the v prefix" >&2
            exit 1
          fi
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/keystore.jks" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          node scripts/restore-google-play-service-account.mjs "$RUNNER_TEMP/google-play-service-account.json"

  build:
    if: ${{ inputs.validate_only == false }}
    needs: preflight
    outputs:
      aab_sha256: ${{ steps.verify_aab.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_REACT_NATIVE_ARCHITECTURES: "armeabi-v7a,arm64-v8a"
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      EXPO_PUBLIC_MIXPANEL_API_HOST: ${{ vars.EXPO_PUBLIC_MIXPANEL_API_HOST }}
      EXPO_PUBLIC_MIXPANEL_TOKEN: ${{ vars.EXPO_PUBLIC_MIXPANEL_TOKEN }}
      EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_SENTRY_ENVIRONMENT }}
      EXPO_PUBLIC_SENTRY_RELEASE: openings-mobile@${{ inputs.version_name }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Check out mobile
        uses: actions/checkout@v6
        with:
          path: mobile
      - name: Check out public core package
        uses: actions/checkout@v6
        with:
          path: core
          repository: openings-dev/core
      - name: Check out public design-tokens package
        uses: actions/checkout@v6
        with:
          path: design-tokens
          repository: openings-dev/design-tokens
      - name: Free disk space for the Android native build
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            design-tokens/package-lock.json
            mobile/package-lock.json
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install and verify public packages
        run: |
          npm ci --prefix core
          npm run check --prefix core
          npm ci --prefix design-tokens
          npm run check --prefix design-tokens
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Install Fastlane
        working-directory: mobile
        run: bundle install --jobs 4 --retry 3
      - name: Restore Android signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > mobile/android/keystore.properties
      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/google-services.json
      - name: Verify the mobile repository
        working-directory: mobile
        run: bundle exec fastlane android check
      - name: Build signed Android App Bundle
        working-directory: mobile
        run: bundle exec fastlane android bundle_release
      - name: Install pinned bundletool
        run: |
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Verify signed Android App Bundle
        id: verify_aab
        env:
          AAB_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        working-directory: mobile
        run: |
          node scripts/verify-android-aab.mjs android/app/build/outputs/bundle/release/app-release.aab
          printf 'sha256=%s\n' "$(sha256sum android/app/build/outputs/bundle/release/app-release.aab | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Preserve signed Android App Bundle
        uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          if-no-files-found: error
          name: openings-android-${{ inputs.version_code }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

  publish:
    if: ${{ inputs.validate_only == false }}
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: android-google-play-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          path: mobile
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Fastlane
        working-directory: mobile
        run: bundle install --jobs 4 --retry 3
      - uses: actions/download-artifact@v6
        with:
          name: openings-android-${{ inputs.version_code }}
          path: dist
      - name: Install pinned bundletool
        run: |
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Verify downloaded Android App Bundle
        env:
          AAB_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          AAB_EXPECTED_SHA256: ${{ needs.build.outputs.aab_sha256 }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        working-directory: mobile
        run: node scripts/verify-android-aab.mjs ../dist/app-release.aab
      - name: Restore Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node mobile/scripts/restore-google-play-service-account.mjs "$RUNNER_TEMP/google-play-service-account.json"
      - name: Upload signed bundle to Google Play internal testing
        env:
          GOOGLE_PLAY_JSON_KEY_FILE: ${{ runner.temp }}/google-play-service-account.json
        working-directory: mobile
        run: bundle exec fastlane android upload_internal aab:../dist/app-release.aab
      - name: Remove Google Play credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/google-play-service-account.json"
